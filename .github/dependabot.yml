version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      codeql:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # A new Python minor is a runtime change, made by hand with .python-version
    # and requires-python.
    ignore:
      - dependency-name: docker/library/python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
